<!--
  sample-project — a minimal, brand-neutral HyperFrames composition.

  This exists so the tool has a working example to model structure from and to
  `cp` from when scaffolding a new project. It uses the placeholder tokens in
  ../../assets/brand-tokens.css — swap in your own brand once you've defined it.

  A 5-second title card: one headline that fades + rises in. Replace the copy,
  colors, and font with your own, then add scenes.
-->
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080">
  <style>
    [data-composition-id="main"] {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #0e0e10; /* --brand-bg placeholder */
      font-family: "Inter", system-ui, sans-serif; /* replace with your display face */
    }
    [data-composition-id="main"] .headline {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -0.02em;
      /* PLACEHOLDER headline treatment — define your own in brand-tokens.css */
      background: linear-gradient(135deg, #ffffff 0%, #d7d7dd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }
  </style>

  <div class="clip headline" data-start="0" data-duration="5" data-track-index="1">
    Your headline here
  </div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      tl.from('[data-composition-id="main"] .headline', {
        opacity: 0,
        y: 40,
        duration: 0.8,
        ease: "power3.out"
      }, 0.2);
      // anchor the timeline to the full composition duration
      tl.to({}, { duration: 5 }, 0);
      window.__timelines["main"] = tl;
    })();
  </script>
</div>
